<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wa-audit · panel</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; }
  header { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; padding: .6rem 1rem; border-bottom: 1px solid #8884; }
  header h1 { font-size: 1rem; margin: 0 .5rem 0 0; }
  nav { display: flex; flex-wrap: wrap; gap: .25rem; padding: .5rem 1rem; border-bottom: 1px solid #8884; }
  nav button[aria-selected="true"] { font-weight: bold; text-decoration: underline; }
  main { padding: 1rem; max-width: 1100px; }
  h2 { font-size: 1.15rem; } h3 { font-size: 1rem; } h4 { font-size: .95rem; margin-bottom: .2rem; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  td, th { border-bottom: 1px solid #8883; padding: .3rem .5rem; text-align: left; vertical-align: top; }
  tr.clickable { cursor: pointer; } tr.clickable:hover { background: #8882; }
  pre.log { background: #111; color: #ddd; padding: .75rem; height: 22rem; overflow: auto; font-size: .8rem; white-space: pre-wrap; margin: 0; }
  pre.log .err { color: #f99; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .4rem 0; }
  .ok { color: #2a7; } .miss { color: #a55; } .muted { opacity: .7; } .error { color: #c33; white-space: pre-wrap; }
  .card { border: 1px solid #8884; border-radius: .5rem; padding: .75rem; margin: .6rem 0; }
  .msg { padding: .25rem .5rem; margin: .15rem 0; border-radius: .4rem; max-width: 70%; white-space: pre-wrap; }
  .msg.inbound { background: #8882; } .msg.outbound { background: #2a72; margin-left: auto; }
  label.field { display: grid; gap: .2rem; margin: .4rem 0; }
  textarea { min-height: 4rem; font: inherit; }
  input, select, textarea { font: inherit; }
  img.qr { image-rendering: pixelated; width: 260px; height: 260px; border: 1px solid #8884; display: block; }
  q { font-style: italic; }
  .primary { font-weight: bold; padding: .45rem 1rem; }
  ul.steps { list-style: none; padding: 0; margin: .5rem 0; } ul.steps li { padding: .15rem 0; } .now { font-weight: bold; }
  details { margin: .4rem 0; } summary { cursor: pointer; }
  input:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <h1>wa-audit</h1>
  <label>Auditoría <select id="audit"></select></label>
  <input id="new-slug" placeholder="nueva auditoría (ej. acme-2026)" pattern="[a-z0-9][a-z0-9-]{0,63}">
  <button id="new-audit">Crear</button>
  <span id="job-badge" class="muted"></span>
</header>
<nav id="tabs" role="tablist"></nav>
<main>
  <p id="global-error" class="error" hidden></p>
  <section id="tab-inicio"></section>
  <section id="tab-estado"></section>
  <section id="tab-fuente"></section>
  <section id="tab-pipeline"></section>
  <section id="tab-contexto"></section>
  <section id="tab-corpus"></section>
  <section id="tab-hallazgos"></section>
  <section id="tab-reportes"></section>
  <section id="tab-config"></section>
</main>
<script nonce="__CSP_NONCE__">
// ------------------------------------------------------------ plumbing ---
const H = { 'content-type': 'application/json', 'x-wa-panel': '1' };
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: method === 'GET' ? {} : H, body: body === undefined ? undefined : JSON.stringify(body) });
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('json') ? await r.json() : null;
  if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
  return data;
}
// Every node is built here; strings become text nodes, never markup.
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'on') for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
    else if (k === 'value') n.value = v;
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
const $ = (id) => document.getElementById(id);
const showError = (e) => { const p = $('global-error'); p.textContent = e && e.message ? e.message : String(e); p.hidden = false; };
const clearError = () => { $('global-error').hidden = true; };

// Inicio is the guided screen; the other eight tabs live behind "Avanzado".
const TABS = [['inicio', 'Inicio'], ['estado', 'Estado'], ['fuente', 'Fuente y WAHA'], ['pipeline', 'Pipeline'], ['contexto', 'Contexto'], ['corpus', 'Corpus'], ['hallazgos', 'Hallazgos'], ['reportes', 'Reportes'], ['config', 'Config']];
const STEP_LABEL = { context: 'completar el contexto de negocio', export: 'exportar el historial', threads: 'construir el corpus', analyze: 'correr el análisis', report: 'generar los reportes' };
const STEP_TAB = { context: 'contexto', export: 'pipeline', threads: 'pipeline', analyze: 'pipeline', report: 'reportes' };
let slug = localStorage.getItem('wa-panel.audit') || '';
let advanced = localStorage.getItem('wa-panel.advanced') === '1';
let tab = localStorage.getItem('wa-panel.tab') || 'inicio';
if (!TABS.some(([id]) => id === tab) || (!advanced && tab !== 'inicio')) tab = 'inicio';
let es = null;             // EventSource of the live log
let qrTimer = null;        // QR refresh interval
let progressTimer = null;  // "Iniciar auditoría" progress poll

// ------------------------------------------------------- audits + tabs ---
async function loadAudits() {
  const audits = await api('GET', '/api/audits');
  const sel = clear($('audit'));
  for (const a of audits) sel.append(el('option', { value: a.slug }, a.error ? a.slug + ' · ⚠ config rota' : a.slug + ' · ' + a.business_name));
  if (!audits.some((a) => a.slug === slug)) slug = audits[0] ? audits[0].slug : '';
  sel.value = slug;
  localStorage.setItem('wa-panel.audit', slug);
  return audits;
}
$('audit').addEventListener('change', (e) => { slug = e.target.value; localStorage.setItem('wa-panel.audit', slug); render(); });
async function createAudit() {
  const input = $('new-slug');
  const name = input.value.trim();
  if (!name) return;
  try {
    await api('POST', '/api/audits', { slug: name });
    input.value = '';
    slug = name;
    await loadAudits();
    await render();
  } catch (e) { showError(e); }
}
$('new-audit').addEventListener('click', createAudit);
$('new-slug').addEventListener('keydown', (e) => { if (e.key === 'Enter') createAudit(); });
function buildTabs() {
  const nav = clear($('tabs'));
  const tabBtn = ([id, label]) => el('button', { role: 'tab', 'aria-selected': String(id === tab), on: { click: () => { tab = id; localStorage.setItem('wa-panel.tab', id); render(); } } }, label);
  nav.append(tabBtn(TABS[0]));
  if (advanced) for (const t of TABS.slice(1)) nav.append(tabBtn(t));
  nav.append(el('button', { class: 'muted', on: { click: () => {
    advanced = !advanced;
    localStorage.setItem('wa-panel.advanced', advanced ? '1' : '0');
    if (!advanced) { tab = 'inicio'; localStorage.setItem('wa-panel.tab', tab); }
    render();
  } } }, advanced ? 'Avanzado ▴' : 'Avanzado ▾'));
}
async function render() {
  clearError();
  buildTabs();
  if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  if (es) { es.close(); es = null; }
  for (const [id] of TABS) $('tab-' + id).hidden = id !== tab;
  const sec = clear($('tab-' + tab));
  if (!slug && tab !== 'inicio') { sec.append(el('p', {}, 'No hay auditorías todavía. Creá una en Inicio o escribí un nombre arriba y apretá Crear.')); return; }
  try { await RENDER[tab](sec); } catch (e) { sec.append(el('p', { class: 'error' }, e.message)); }
}

// --------------------------------------------------------------- estado ---
async function renderEstado(sec) {
  const st = await api('GET', '/api/audits/' + slug + '/status');
  sec.append(el('h2', {}, 'Estado de "' + slug + '"'), el('p', { class: 'muted' }, st.dir));
  sec.append(el('table', {}, el('tbody', {}, Object.entries(st.files).map(([f, ok]) =>
    el('tr', {}, el('td', {}, f), el('td', { class: ok ? 'ok' : 'miss' }, ok ? 'presente' : 'falta'))))));
  sec.append(el('p', {}, 'Próximo paso: ', el('strong', {}, STEP_LABEL[st.next_step]), ' ',
    el('button', { on: { click: () => { tab = STEP_TAB[st.next_step]; localStorage.setItem('wa-panel.tab', tab); render(); } } }, 'Ir')));
  if (st.summary) {
    const s = st.summary;
    const keys = ['threads', 'two_way_threads', 'unanswered_threads', 'messages_included', 'inbound', 'outbound', 'global_median_response_min', 'lids_unresolved', 'crm_matches', 'internal_threads'];
    sec.append(el('h3', {}, 'Resumen del corpus'), el('table', {}, el('tbody', {}, keys.map((k) => el('tr', {}, el('td', {}, k), el('td', {}, String(s[k])))))));
    if (s.warnings && s.warnings.length) sec.append(el('h4', {}, 'Avisos'), el('ul', {}, s.warnings.map((w) => el('li', {}, w))));
  }
  sec.append(el('p', {}, 'Dimensiones analizadas: ' + (st.dimensions_done.length ? st.dimensions_done.join(', ') : 'ninguna')));
}

// --------------------------------------------------------------- fuente ---
async function renderFuente(sec) {
  const cfg = await api('GET', '/api/audits/' + slug + '/config');
  const kind = el('select', {}, ['waha', 'kapso', 'ig'].map((k) => el('option', { value: k, selected: k === cfg.source.kind }, k)));
  const session = el('input', { value: cfg.source.session });
  sec.append(el('h2', {}, 'Fuente de datos'),
    el('div', { class: 'row' }, el('label', {}, 'Tipo ', kind), el('label', {}, 'Sesión ', session),
      el('button', { on: { click: async () => {
        try { cfg.source = { kind: kind.value, session: session.value.trim() }; await api('PUT', '/api/audits/' + slug + '/config', cfg); render(); } catch (e) { showError(e); }
      } } }, 'Guardar')),
    el('p', { class: 'muted' }, 'WAHA: nombre de la sesión en la instancia. Kapso e Instagram: etiqueta libre del corpus (los scripts leen kapso.env / ig.env).'));

  const envs = await api('GET', '/api/env');
  sec.append(el('h3', {}, 'Archivos .env'),
    el('p', { class: 'muted' }, 'Se cargan al arrancar el panel: reiniciá el panel después de editarlos. Solo se muestran los nombres de las claves.'),
    el('table', {}, el('tbody', {}, envs.files.map((e) => el('tr', {}, el('td', {}, e.file),
      el('td', { class: e.exists ? 'ok' : 'miss' }, e.exists ? 'presente · claves: ' + (e.keys.join(', ') || '(ninguna)') : 'no existe'))))));
  if (envs.overrides.length) sec.append(el('p', { class: 'error' }, 'Estas variables de entorno pisan la config de TODAS las auditorías: ' + envs.overrides.join(', ') + '. Sacalas del entorno o de los .env para que valga la config por auditoría.'));

  if (cfg.source.kind !== 'waha') return;
  const box = el('div', { class: 'card' });
  sec.append(el('h3', {}, 'WAHA'), box);
  const qrArea = el('div');
  const showQr = (name) => qrInto(qrArea, name, async () => { await refresh(); box.append(el('p', { class: 'ok' }, 'Sesión "' + name + '" en WORKING: ya podés correr el probe.')); });
  const refresh = async () => {
    if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
    clear(box);
    try {
      const sessions = await api('GET', '/api/waha/sessions');
      box.append(el('table', {}, el('tbody', {}, sessions.map((s) => el('tr', {}, el('td', {}, s.name), el('td', {}, s.status), el('td', {}, s.engine || ''))))));
      if (!sessions.length) box.append(el('p', {}, 'Sin sesiones.'));
    } catch (e) {
      box.append(el('p', { class: 'error' }, 'WAHA no responde: ' + e.message));
    }
    const name = el('input', { value: cfg.source.session, placeholder: 'nombre de sesión' });
    box.append(el('div', { class: 'row' }, name,
      el('button', { on: { click: async () => { try { await api('POST', '/api/waha/sessions', { name: name.value.trim() }); await refresh(); showQr(name.value.trim()); } catch (e) { showError(e); } } } }, 'Crear sesión (fullSync)'),
      el('button', { on: { click: () => showQr(name.value.trim()) } }, 'Mostrar QR'),
      el('button', { on: { click: refresh } }, 'Actualizar')));
    box.append(qrArea);
    box.append(el('p', { class: 'muted' }, 'Creá la sesión con fullSync ANTES de vincular el teléfono: activarlo después no trae el historial. La sesión ocupa un lugar de "dispositivo vinculado"; liberalo después de exportar. El historial completo necesita motor NOWEB o GOWS (el probe lo verifica).'));
  };
  await refresh();
}

// ------------------------------------------------------------- pipeline ---
async function renderPipeline(sec) {
  const cfg = await api('GET', '/api/audits/' + slug + '/config');
  const dims = await api('GET', '/api/dimensions');
  const kind = cfg.source.kind;
  sec.append(el('h2', {}, 'Pipeline · fuente ' + kind + ' · sesión ' + cfg.source.session));
  const runBtn = (step, options, label) => el('button', { on: { click: () => runStep(step, typeof options === 'function' ? options() : options) } }, label || 'Correr');
  const rows = el('div');
  if (kind === 'waha') rows.append(el('div', { class: 'row card' }, el('strong', {}, '0. Probe'), el('span', { class: 'muted' }, 'solo lectura: motor, sesión, profundidad del historial'), runBtn('probe', {})));
  const since = el('input', { type: 'number', min: '1', placeholder: 'días (opcional)' });
  rows.append(el('div', { class: 'row card' }, el('strong', {}, '2. Export'),
    el('span', { class: 'muted' }, kind === 'waha' ? 'volcado crudo, reanudable' : kind === 'kapso' ? 'API oficial vía Kapso (kapso.env)' : 'DMs de Instagram (cookie en ig.env)'),
    kind === 'ig' ? el('label', {}, '--since ', since) : null,
    runBtn('export', () => (kind === 'ig' && since.value ? { since: Number(since.value) } : {}))));
  const noNet = el('input', { type: 'checkbox' });
  rows.append(el('div', { class: 'row card' }, el('strong', {}, '3. Corpus'), el('span', { class: 'muted' }, 'threads.json + summary.json + messages.csv'),
    kind === 'waha' ? el('label', {}, noNet, ' --no-net (no resolver @lid contra WAHA)') : el('span', { class: 'muted' }, '--no-net forzado'),
    runBtn('threads', () => ({ noNet: noNet.checked }))));
  const checks = dims.map((d) => { const c = el('input', { type: 'checkbox', value: d.key }); return { key: d.key, c, label: el('label', {}, c, ' ' + d.key + ' · ' + d.title) }; });
  const setAll = (pred) => { for (const x of checks) x.c.checked = pred(x.key); };
  rows.append(el('div', { class: 'card' },
    el('div', { class: 'row' }, el('strong', {}, '4. Análisis'), el('span', { class: 'muted' }, 'LLM + verificación obligatoria (proveedor en Config; sin selección = todas)'),
      el('button', { on: { click: () => setAll(() => true) } }, 'Todas'),
      el('button', { on: { click: () => setAll((k) => !k.startsWith('fate_')) } }, 'Comerciales'),
      el('button', { on: { click: () => setAll((k) => k.startsWith('fate_')) } }, 'Set FATE'),
      el('button', { on: { click: () => setAll(() => false) } }, 'Ninguna'),
      runBtn('analyze', () => ({ dimensions: checks.filter((x) => x.c.checked).map((x) => x.key) }))),
    el('div', {}, checks.map((x) => el('div', {}, x.label)))));
  rows.append(el('div', { class: 'row card' }, el('strong', {}, '5. Reportes'), runBtn('report-xlsx', {}, 'XLSX'), runBtn('report-html', {}, 'HTML'), runBtn('report-docx', {}, 'DOCX')));
  sec.append(rows);
  sec.append(el('h3', {}, 'Log'), el('div', { class: 'row' }, el('button', { on: { click: cancelJob } }, 'Cancelar'), el('span', { id: 'job-state', class: 'muted' })), el('pre', { class: 'log', id: 'log' }));
  attachLog();
}
async function runStep(step, options) {
  clearError();
  try { await api('POST', '/api/audits/' + slug + '/run', { step, options: options || {} }); } catch (e) { showError(e); return; }
  if (tab !== 'pipeline') { tab = 'pipeline'; localStorage.setItem('wa-panel.tab', tab); await render(); } else attachLog();
}
async function cancelJob() {
  try { await api('POST', '/api/jobs/cancel'); } catch (e) { showError(e); }
}
/** Streams the current job's log into `log` (default: the Pipeline tab's pane); `onEnd` gets the end event. */
function attachLog(log = $('log'), state = $('job-state'), onEnd) {
  if (!log) return;
  if (es) { es.close(); es = null; }
  clear(log);
  if (state) state.textContent = 'conectando…';
  const src = new EventSource('/api/jobs/stream');
  es = src;
  src.onmessage = (ev) => {
    const { s, t } = JSON.parse(ev.data);
    log.append(el('span', { class: s === 'err' ? 'err' : '' }, t + '\n'));
    log.scrollTop = log.scrollHeight;
    if (state) state.textContent = 'corriendo…';
  };
  src.addEventListener('end', (ev) => {
    src.close();
    if (es === src) es = null;
    const { exit_code, signal, cancelled } = JSON.parse(ev.data);
    if (state) {
      state.textContent = cancelled ? 'cancelado'
        : signal ? 'terminado por señal ' + signal
        : exit_code === 0 ? 'terminó OK'
        : exit_code === null ? 'sin jobs todavía'
        : 'terminó con exit ' + exit_code;
    }
    updateBadge();
    if (onEnd) onEnd({ exit_code, signal, cancelled });
  });
  src.onerror = () => { src.close(); if (es === src) es = null; };
  updateBadge();
}
async function updateBadge() {
  try {
    const j = await api('GET', '/api/jobs/current');
    $('job-badge').textContent = !j ? '' : j.running ? '⏳ ' + j.step + ' en ' + j.slug
      : j.cancelled ? 'último job: ' + j.step + ' (cancelado)'
      : j.signal ? 'último job: ' + j.step + ' (señal ' + j.signal + ')'
      : 'último job: ' + j.step + ' (' + (j.exit_code === 0 ? 'OK' : 'exit ' + j.exit_code) + ')';
  } catch (e) { /* badge is best-effort */ }
}

// ------------------------------------------------------------- contexto ---
const CONTEXT_FIELDS = [['what_we_sell', '¿Qué venden?'], ['who_buys', '¿Quién compra?'], ['sales_process', 'Proceso de venta'], ['team_on_this_number', '¿Quién atiende este número?'], ['goals', 'Objetivos'], ['known_problems', 'Problemas conocidos'], ['tone_intent', 'Tono buscado']];
async function renderContexto(sec) {
  const ctx = await api('GET', '/api/audits/' + slug + '/business-context');
  sec.append(el('h2', {}, 'Contexto de negocio (entrevista al operador)'),
    el('p', { class: 'muted' }, 'El análisis y el verificador lo reciben. Las claves extra que ya existan en el archivo se conservan.'));
  const inputs = CONTEXT_FIELDS.map(([k, label]) => {
    const v = ctx[k];
    const ta = el('textarea', { value: v === undefined ? '' : typeof v === 'string' ? v : JSON.stringify(v) });
    sec.append(el('label', { class: 'field' }, label, ta));
    return [k, ta];
  });
  sec.append(el('button', { on: { click: async () => {
    try {
      const out = { ...ctx };
      for (const [k, ta] of inputs) { if (ta.value.trim()) out[k] = ta.value; else delete out[k]; }
      await api('PUT', '/api/audits/' + slug + '/business-context', out);
      render();
    } catch (e) { showError(e); }
  } } }, 'Guardar'));
}

// --------------------------------------------------------------- corpus ---
async function renderCorpus(sec, offset = 0) {
  const page = await api('GET', '/api/audits/' + slug + '/threads?offset=' + offset + '&limit=20');
  sec.append(el('h2', {}, 'Corpus · ' + page.total + ' hilos'));
  const detail = el('div', { class: 'card' }, el('p', { class: 'muted' }, 'Elegí un hilo.'));
  sec.append(el('table', {},
    el('thead', {}, el('tr', {}, ['Contacto', 'Flags', 'In', 'Out', 'Sin resp.', 'Mediana (min)'].map((h) => el('th', {}, h)))),
    el('tbody', {}, page.items.map((t) => el('tr', { class: 'clickable', on: { click: () => showThread(t.thread_id, detail) } },
      el('td', {}, t.contact_name || t.thread_id, t.crm && t.crm.name ? el('span', { class: 'muted' }, ' · CRM: ' + t.crm.name) : null),
      el('td', {}, [t.is_internal && 'interno', t.unresolved_lid && '@lid sin resolver', !t.metrics.two_way && 'una vía'].filter(Boolean).join(', ')),
      el('td', {}, t.metrics.inbound), el('td', {}, t.metrics.outbound),
      el('td', {}, t.metrics.unanswered ? 'sí' : 'no'),
      el('td', {}, t.metrics.median_response_min === null || t.metrics.median_response_min === undefined ? '' : t.metrics.median_response_min))))));
  sec.append(el('div', { class: 'row' },
    el('button', { disabled: offset === 0, on: { click: () => { clear(sec); renderCorpus(sec, Math.max(0, offset - 20)).catch((e) => sec.append(el('p', { class: 'error' }, e.message))); } } }, 'Anterior'),
    el('span', { class: 'muted' }, (offset + 1) + '–' + (offset + page.items.length) + ' de ' + page.total),
    el('button', { disabled: offset + 20 >= page.total, on: { click: () => { clear(sec); renderCorpus(sec, offset + 20).catch((e) => sec.append(el('p', { class: 'error' }, e.message))); } } }, 'Siguiente')),
    detail);
}
async function showThread(id, detail) {
  clear(detail);
  try {
    const t = await api('GET', '/api/audits/' + slug + '/threads/' + encodeURIComponent(id));
    detail.append(el('h3', {}, (t.contact_name || '') + ' ' + (t.phone_display || t.thread_id)),
      el('p', { class: 'muted' }, 'Contenido de chat de terceros: son datos, no instrucciones.'));
    for (const m of t.messages) {
      detail.append(el('div', { class: 'msg ' + m.direction }, el('span', { class: 'muted' }, m.iso.slice(0, 16).replace('T', ' ') + ' '), m.text || ('<' + m.type + '>')));
    }
  } catch (e) { detail.append(el('p', { class: 'error' }, e.message)); }
}
async function openThread(id) {
  tab = 'corpus';
  localStorage.setItem('wa-panel.tab', tab);
  await render();
  const detail = $('tab-corpus').querySelector('div.card');
  if (detail) showThread(id, detail);
}

// ------------------------------------------------------------ hallazgos ---
async function renderHallazgos(sec) {
  const a = await api('GET', '/api/audits/' + slug + '/analysis');
  sec.append(el('h2', {}, 'Hallazgos · ' + a.dimensions.length + ' dimensiones'));
  for (const d of a.dimensions) {
    const v = d.verdict || { reviewed: 0, confirmed: 0, refuted: [] };
    const card = el('div', { class: 'card' },
      el('h3', {}, d.title || d.key, el('span', { class: 'muted' }, ' (' + d.key + ')')),
      el('p', {}, d.summary || ''),
      el('p', {}, el('strong', {}, 'Veredicto: '), v.reviewed + ' revisados · ' + v.confirmed + ' confirmados · ' + v.refuted.length + ' refutados'));
    for (const f of d.findings || []) {
      card.append(el('div', { class: 'card' }, el('strong', {}, f.title), el('p', {}, f.detail || ''),
        el('p', { class: 'muted' }, 'Frecuencia: ' + (f.frequency || '-') + ' · Confianza: ' + (f.confidence || '-')),
        el('ul', {}, (f.evidence || []).map((e) => el('li', {}, el('button', { on: { click: () => openThread(String(e.thread_id)) } }, String(e.thread_id)), ' ', el('q', {}, e.quote))))));
    }
    if (v.refuted.length) {
      card.append(el('h4', {}, 'Refutados por la verificación'), el('ul', {}, v.refuted.map((r) =>
        el('li', {}, el('strong', {}, r.title), ': ' + r.reason, r.correction ? el('span', { class: 'muted' }, ' · ' + r.correction) : null))));
    }
    if (d.limitations && d.limitations.length) card.append(el('p', { class: 'muted' }, 'Limitaciones: ' + d.limitations.join(' · ')));
    sec.append(card);
  }
}

// ------------------------------------------------------------- reportes ---
async function renderReportes(sec) {

  sec.append(el('h2', {}, 'Reportes'));
  const rows = [['report-xlsx', cfg.report.filename, 'XLSX (planilla del cliente)'], ['report-html', base + '.html', 'HTML (archivo único)'], ['report-docx', base + '.docx', 'DOCX (Word)']];

      st.files[file] ? el('a', { href: '/api/audits/' + slug + '/files/' + encodeURIComponent(file) }, 'Descargar') : null))))));
  sec.append(el('h3', {}, 'Datos'), el('ul', {}, ['threads.json', 'summary.json', 'analysis.json', 'messages.csv'].map((f) =>
    el('li', {}, st.files[f] ? el('a', { href: '/api/audits/' + slug + '/files/' + f }, f) : el('span', { class: 'muted' }, f + ' (falta)')))));
  if (st.next_step !== 'report') sec.append(el('p', { class: 'muted' }, 'Antes hay que ' + STEP_LABEL[st.next_step] + '.'));
}

// --------------------------------------------------------------- config ---
const CONFIG_FIELDS = [
  ['business.name', 'Nombre del negocio (aparece en el reporte)', 'text'],
  ['business.internalNumbers', 'Números internos, separados por coma (se excluyen de las métricas de clientes)', 'list'],
  ['business.internalEmailDomains', 'Dominios de email internos, separados por coma', 'list'],
  ['phone.defaultCountry', 'País por defecto para números del CRM sin prefijo (ISO-3166, ej. AR)', 'text'],
  ['timezone.utcOffset', 'Offset UTC (ej. -03:00)', 'text'],
  ['locale', 'Locale del reporte (ej. es-AR)', 'text'],
  ['report.filename', 'Nombre del XLSX (los otros formatos usan la misma base)', 'text'],
  ['crm.file', 'CSV del CRM (ruta en esta máquina; vacío = sin CRM)', 'nullable'],
  ['llm.provider', 'Proveedor LLM', ['anthropic', 'openai', 'mock']],
  ['llm.model', 'Modelo (vacío = default del proveedor; openai lo exige)', 'nullable'],
  ['llm.baseUrl', 'Base URL (endpoints compatibles con OpenAI; vacío = default)', 'nullable'],
  ['llm.maxTokens', 'Max tokens de salida', 'number'],
  ['llm.cannedDir', 'Directorio de respuestas enlatadas (solo proveedor mock)', 'nullable'],
  ['analysis.language', 'Idioma en que escribe el análisis', 'text'],
  ['analysis.maxCorpusChars', 'Presupuesto de caracteres del corpus', 'number'],
  ['source.kind', 'Fuente', ['waha', 'kapso', 'ig']],
  ['source.session', 'Sesión', 'text'],
];
const getPath = (o, p) => p.split('.').reduce((a, k) => (a === null || a === undefined ? undefined : a[k]), o);
const setPath = (o, p, v) => { const ks = p.split('.'); let cur = o; for (const k of ks.slice(0, -1)) { if (!cur[k]) cur[k] = {}; cur = cur[k]; } cur[ks[ks.length - 1]] = v; };
async function renderConfig(sec) {
  const cfg = await api('GET', '/api/audits/' + slug + '/config');
  sec.append(el('h2', {}, 'Configuración de la auditoría'),
    el('p', { class: 'muted' }, 'Archivo: data/' + slug + '/wa-audit.config.json. Las claves de API van en los archivos .env, nunca acá.'));
  const inputs = CONFIG_FIELDS.map(([p, label, kind]) => {
    const v = getPath(cfg, p);
    let input;
    if (Array.isArray(kind)) input = el('select', {}, kind.map((o) => el('option', { value: o, selected: o === v }, o)));
    else if (kind === 'list') input = el('input', { value: (v || []).join(', ') });
    else if (kind === 'number') input = el('input', { type: 'number', value: v === null || v === undefined ? '' : v });
    else input = el('input', { value: v === null || v === undefined ? '' : v });
    sec.append(el('label', { class: 'field' }, label, input));
    return [p, kind, input];
  });
  const msg = el('p', { class: 'error' });
  sec.append(el('button', { on: { click: async () => {
    const out = structuredClone(cfg);
    for (const [p, kind, input] of inputs) {
      const raw = input.value.trim();
      setPath(out, p, kind === 'list' ? raw.split(',').map((s) => s.trim()).filter(Boolean) : kind === 'number' ? Number(raw) : kind === 'nullable' ? (raw || null) : raw);
    }
    try { await api('PUT', '/api/audits/' + slug + '/config', out); msg.className = 'ok'; msg.textContent = 'Guardado.'; } catch (e) { msg.className = 'error'; msg.textContent = e.message; }
  } } }, 'Guardar'), msg);
}

// ---------------------------------------------------------------- inicio ---
/** Shows the pairing QR for a WAHA session in `box`, refreshing every 20 s until the session is WORKING, then calls onWorking. */
function qrInto(box, name, onWorking) {
  if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
  clear(box);
  const img = el('img', { class: 'qr', alt: 'QR de vinculación' });
  box.append(el('p', {}, 'Escaneá desde el teléfono del negocio: WhatsApp → Dispositivos vinculados → Vincular un dispositivo. El QR rota; se refresca solo cada 20 s.'), img);
  const tick = async () => {
    img.src = '/api/waha/qr/' + encodeURIComponent(name) + '?t=' + Date.now();
    try {
      const s = (await api('GET', '/api/waha/sessions')).find((x) => x.name === name);
      if (s && s.status === 'WORKING') { clearInterval(qrTimer); qrTimer = null; clear(box); await onWorking(); }
    } catch (e) { /* the next tick retries */ }
  };
  tick();
  qrTimer = setInterval(tick, 20000);
}
const slugify = (s) => (String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 64) || 'auditoria');
const ALL_STEPS = [['probe', 'Probar la conexión con WhatsApp'], ['export', 'Exportar el historial'], ['threads', 'Armar el corpus'], ['analyze', 'Analizar con IA y verificar'], ['report-xlsx', 'Reporte XLSX'], ['report-html', 'Reporte HTML'], ['report-docx', 'Reporte DOCX']];
const PROVIDERS = [['anthropic', 'Anthropic (Claude)'], ['openai', 'OpenAI o compatible'], ['mock', 'Simulado (sin IA, para probar)']];
async function renderInicio(sec) {
  const setup = await api('GET', '/api/setup');
  const cfg = slug ? await api('GET', '/api/audits/' + slug + '/config').catch(() => null) : null;
  const note = (box) => { const p = el('p', { class: 'muted' }); box.append(p); return p; };
  const say = (p, cls, text) => { p.className = cls; p.textContent = text; };
  sec.append(el('h2', {}, 'Auditoría en tres pasos'),
    el('p', { class: 'muted' }, 'Levantá WAHA, pegá dos claves, vinculá el teléfono y apretá Iniciar. Todo lo demás vive en "Avanzado".'));

  // 1 · WhatsApp
  const wBase = el('input', { size: '30', value: setup.waha.base || 'http://localhost:3000' });
  const wKey = el('input', { type: 'password', size: '30', placeholder: setup.waha.has_key ? 'clave guardada ✓ (vacío = mantener)' : 'API key de WAHA' });
  const c1 = el('div', { class: 'card' }, el('h3', {}, '1 · WhatsApp (WAHA)'),
    el('div', { class: 'row' }, el('label', {}, 'URL ', wBase), el('label', {}, 'API key ', wKey), el('button', { on: { click: () => saveWaha() } }, 'Guardar y probar')));
  const s1 = note(c1);
  const probeWaha = async () => {
    try {
      const sessions = await api('GET', '/api/waha/sessions');
      say(s1, 'ok', 'WAHA responde · ' + (sessions.length ? sessions.map((s) => s.name + ': ' + s.status).join(' · ') : 'todavía sin sesiones; vinculá el teléfono en el paso 3'));
    } catch (e) { say(s1, 'error', 'WAHA no responde: ' + e.message); }
  };
  const saveWaha = async () => {
    say(s1, 'muted', 'guardando…');
    try {
      Object.assign(setup, await api('POST', '/api/setup', { waha_base: wBase.value.trim(), waha_key: wKey.value }));
      wKey.value = '';
      wKey.placeholder = 'clave guardada ✓ (vacío = mantener)';
      await probeWaha();
    } catch (e) { say(s1, 'error', e.message); }
  };
  if (setup.waha.base) probeWaha();

  // 2 · IA
  const saved = JSON.parse(localStorage.getItem('wa-panel.llm') || '{}');
  const provider = el('select', {}, PROVIDERS.map(([v, l]) => el('option', { value: v, selected: v === ((cfg && cfg.llm.provider) || saved.provider || 'anthropic') }, l)));
  const llmKey = el('input', { type: 'password', size: '30' });
  const model = el('input', { size: '22', placeholder: 'modelo (obligatorio con OpenAI)', value: (cfg && cfg.llm.model) || saved.model || '' });
  const syncLlm = () => {
    const has = provider.value === 'anthropic' ? setup.llm.has_anthropic_key : provider.value === 'openai' ? setup.llm.has_openai_key : true;
    llmKey.disabled = provider.value === 'mock';
    llmKey.placeholder = provider.value === 'mock' ? 'no hace falta' : has ? 'clave guardada ✓ (vacío = mantener)' : 'API key';
    model.hidden = provider.value !== 'openai';
  };
  provider.addEventListener('change', syncLlm);
  syncLlm();
  const c2 = el('div', { class: 'card' }, el('h3', {}, '2 · IA'),
    el('div', { class: 'row' }, provider, llmKey, model, el('button', { on: { click: () => saveLlm() } }, 'Guardar')));
  const s2 = note(c2);
  const saveLlm = async () => {
    try {
      Object.assign(setup, await api('POST', '/api/setup', { llm_provider: provider.value, llm_key: llmKey.value }));
      llmKey.value = '';
      localStorage.setItem('wa-panel.llm', JSON.stringify({ provider: provider.value, model: model.value.trim() }));
      syncLlm();
      say(s2, 'ok', 'Guardado.');
    } catch (e) { say(s2, 'error', e.message); }
  };

  // 3 · Auditoría
  const name = el('input', { size: '30', placeholder: 'nombre del negocio', value: cfg && cfg.business.name !== slug ? cfg.business.name : '' });
  const session = el('input', { size: '20', placeholder: 'sesión WAHA', value: (cfg && cfg.source.session) || '' });
  let sessionTouched = Boolean(cfg && cfg.source.session);
  name.addEventListener('input', () => { if (!sessionTouched) session.value = slugify(name.value); });
  session.addEventListener('input', () => { sessionTouched = true; });
  const c3 = el('div', { class: 'card' }, el('h3', {}, '3 · Auditoría'),
    el('div', { class: 'row' }, el('label', {}, 'Negocio ', name), el('label', {}, 'Sesión ', session),
      el('button', { on: { click: () => linkPhone() } }, 'Vincular teléfono'),
      el('button', { class: 'primary', on: { click: () => startAll() } }, 'Iniciar auditoría')));
  const s3 = note(c3);
  const qrArea = el('div');
  const progress = el('div');
  c3.append(qrArea, progress);
  sec.append(c1, c2, c3);

  const ensureAudit = async () => {
    const label = name.value.trim();
    if (!label) throw new Error('Poné el nombre del negocio.');
    const target = slugify(label);
    const audits = await api('GET', '/api/audits');
    if (!audits.some((a) => a.slug === target)) await api('POST', '/api/audits', { slug: target });
    slug = target;
    localStorage.setItem('wa-panel.audit', slug);
    const c = await api('GET', '/api/audits/' + slug + '/config');
    c.business.name = label;
    c.llm.provider = provider.value;
    c.llm.model = provider.value === 'openai' ? (model.value.trim() || null) : null;
    if (provider.value === 'mock') c.llm.cannedDir = setup.demo_canned_dir;
    c.source = { kind: 'waha', session: session.value.trim() || target };
    await api('PUT', '/api/audits/' + slug + '/config', c);
    localStorage.setItem('wa-panel.llm', JSON.stringify({ provider: provider.value, model: model.value.trim() }));
    await loadAudits();
    return c;
  };
  const linkPhone = async () => {
    try {
      const c = await ensureAudit();
      const s = (await api('GET', '/api/waha/sessions')).find((x) => x.name === c.source.session);
      if (s && s.status === 'WORKING') { say(s3, 'ok', 'Teléfono vinculado ✓ (sesión "' + c.source.session + '"). Apretá Iniciar auditoría.'); return; }
      if (!s) await api('POST', '/api/waha/sessions', { name: c.source.session });
      say(s3, 'muted', 'Escaneá el QR con el teléfono del negocio…');
      qrInto(qrArea, c.source.session, () => { say(s3, 'ok', 'Teléfono vinculado ✓. El historial se sincroniza en segundo plano: apretá Iniciar auditoría.'); probeWaha(); });
    } catch (e) { say(s3, 'error', e.message); }
  };
  const showDownloads = async (box) => {
    const st = await api('GET', '/api/audits/' + slug + '/status');
    const files = Object.keys(st.files).filter((f) => /\.(xlsx|html|docx)$/.test(f) && st.files[f]);
    clear(box);
    if (!files.length) return;
    box.append(el('div', { class: 'row' }, el('strong', {}, 'Descargar:'),
      files.map((f) => el('a', { href: '/api/audits/' + slug + '/files/' + encodeURIComponent(f) }, f.split('.').pop().toUpperCase())),
      el('button', { on: { click: () => { advanced = true; localStorage.setItem('wa-panel.advanced', '1'); tab = 'hallazgos'; localStorage.setItem('wa-panel.tab', tab); render(); } } }, 'Ver hallazgos')));
  };
  const showProgress = (kind) => {
    if (progressTimer) clearInterval(progressTimer);
    clear(progress);
    const steps = kind === 'waha' ? ALL_STEPS : ALL_STEPS.slice(1);
    const items = steps.map(([key, label]) => ({ key, label, li: el('li', { class: 'muted' }, '· ' + label) }));
    const log = el('pre', { class: 'log' });
    const state = el('span', { class: 'muted' });
    const after = el('div');
    progress.append(el('ul', { class: 'steps' }, items.map((x) => x.li)),
      el('div', { class: 'row' }, el('button', { on: { click: cancelJob } }, 'Cancelar'), state),
      el('details', {}, el('summary', {}, 'Ver el log'), log), after);
    const paint = (j) => {
      if (!j || !j.progress) return;
      items.forEach((x, i) => {
        const done = i < j.progress.done;
        const current = x.key === j.progress.step && !done;
        const failed = current && !j.running && j.exit_code !== 0;
        x.li.className = done ? 'ok' : failed ? 'error' : current && j.running ? 'now' : 'muted';
        x.li.textContent = (done ? '✓ ' : failed ? '✗ ' : current && j.running ? '⏳ ' : '· ') + x.label;
      });
    };
    progressTimer = setInterval(async () => { try { paint(await api('GET', '/api/jobs/current')); } catch (e) { /* next tick */ } }, 1500);
    attachLog(log, state, async (end) => {
      if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
      try { paint(await api('GET', '/api/jobs/current')); } catch (e) { /* the list keeps its last state */ }
      if (end.exit_code === 0) { say(s3, 'ok', 'Listo: auditoría completa.'); showDownloads(after); }
      else say(s3, 'error', end.cancelled ? 'Cancelada.' : 'Falló un paso: abrí el log para ver el error.');
    });
  };
  const startAll = async () => {
    try {
      const c = await ensureAudit();
      say(s3, 'muted', 'Arrancando…');
      // The simulated provider can only answer the dimensions that ship canned in the fixtures.
      const options = c.llm.provider === 'mock' ? { dimensions: setup.demo_dimensions } : {};
      await api('POST', '/api/audits/' + slug + '/run', { step: 'all', options });
      showProgress(c.source.kind);
    } catch (e) { say(s3, 'error', e.message); }
  };
  // Reloaded mid-run: reattach to the running job. Otherwise offer what already exists.
  const j = await api('GET', '/api/jobs/current').catch(() => null);
  if (slug && j && j.running && j.slug === slug && j.step === 'all') showProgress(cfg ? cfg.source.kind : 'waha');
  else if (slug && cfg) showDownloads(progress);
}

const RENDER = { inicio: renderInicio, estado: renderEstado, fuente: renderFuente, pipeline: renderPipeline, contexto: renderContexto, corpus: renderCorpus, hallazgos: renderHallazgos, reportes: renderReportes, config: renderConfig };
(async () => {
  try { await loadAudits(); await render(); updateBadge(); setInterval(updateBadge, 5000); } catch (e) { showError(e); }
})();
</script>
