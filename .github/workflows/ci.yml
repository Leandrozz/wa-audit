name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci

      # Fixtures must be deterministic: regenerating them must be a no-op.
      - name: Fixture determinism
        run: |
          node fixtures/generate.mjs
          git diff --exit-code fixtures/waha-dump/

      - run: npm test

      # The demo is the README's first promise — keep it honest.
      - run: npm run demo
